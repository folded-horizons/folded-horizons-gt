plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "foldedhorizons-gt"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // The core mod is a sibling repo. During development publish it with
    //   (core repo) gradle :core:publishToMavenLocal
    // Released versions also resolve from GitHub Packages (see CI).
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    api "dev.foldedhorizons:foldedhorizons:${mod_version}"
}

neoForge {
    version = project.neo_version

    mods {
        "foldedhorizons-gt" {
            sourceSet sourceSets.main
        }
    }
}
